name: Publish tonto CLI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish tonto-language
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/language/package.json').version")
          test "$RELEASE_TAG" = "tonto-language-v$PACKAGE_VERSION"
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Pack and install the CLI outside the workspace
        run: npm run test:package --workspace=tonto-language
      - name: Publish with npm trusted publishing
        run: npm publish --workspace=tonto-language --access public
